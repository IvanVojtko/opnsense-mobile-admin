stages:
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_CMDLINE_TOOLS_VERSION: "13114758"

cache:
  key: "$CI_PROJECT_NAME-gradle"
  paths:
    - .gradle/
    - android-sdk/

build_release_apk:
  stage: build
  image: eclipse-temurin:17-jdk
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([.-].*)?$/'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl unzip ca-certificates
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - |
      if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
        curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip" -o /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      fi
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - yes | sdkmanager --licenses > /dev/null
    - sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"
    - chmod +x ./gradlew
  script:
    - ./gradlew --no-daemon assembleRelease
  artifacts:
    name: "opnsense-admin-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/release/*.apk
